name: Build Android APK
run-name: Build APK - ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type d
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install required Android packages
        shell: bash
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project archive
        run: |
          test -f source-project.zip
          unzip -l source-project.zip | head -40

      - name: Extract Android project
        run: unzip -q source-project.zip

      - name: Set association logo as Android launcher icon
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import shutil, xml.etree.ElementTree as ET
          app = Path("bajil_android_project/app/src/main")
          manifest = app / "AndroidManifest.xml"
          roots = [app / "assets", app / "res", Path("bajil_android_project")]
          exts = {".png", ".jpg", ".jpeg", ".webp"}
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in exts)
          files = list(dict.fromkeys(files))
          print("Image assets found:")
          for p in files:
              print(f" - {p} ({p.stat().st_size} bytes)")
          keywords = ("logo", "emblem", "crest", "seal", "association", "jameya", "jamia")
          candidates = [p for p in files if any(k in p.stem.lower() for k in keywords) and p.stat().st_size > 100]
          if not candidates:
              print("WARNING: No clearly named association logo found; leaving launcher icon unchanged.")
              raise SystemExit(0)
          logo = sorted(candidates, key=lambda p: (0 if "logo" in p.stem.lower() else 1, len(p.name)))[0]
          print(f"Using association logo: {logo}")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          ns = "{http://schemas.android.com/apk/res/android}"
          ext = logo.suffix.lower()
          resource_name = "ic_launcher" + ext
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              folder = app / "res" / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              shutil.copy2(logo, folder / resource_name)
          application.set(ns + "icon", "@mipmap/ic_launcher")
          application.set(ns + "roundIcon", "@mipmap/ic_launcher")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Association launcher icon configured.")
          PY

      - name: Refine login, sticky header, watermark and fullscreen display
