      - name: Apply v8 farmer, invoice and local-storage updates
        run: python3 scripts/apply-v8-modifications.py

      - name: Repair login initialization and add safe administrator recovery
        run: python3 scripts/fix-login-recovery.py

      - name: Repair login database initialization
        run: python3 scripts/repair-login-db.py

      - name: Set administrator login to Naif and validate recovery
        run: python3 scripts/set-naif-admin-login.py

      - name: Verify Naif login credentials and startup synchronization
        run: python3 scripts/verify-naif-login.py

      - name: Validate bundled JavaScript syntax
        run: python3 scripts/validate-web-assets.py

      - name: Locate Android project
        run: |
          test -f bajil_android_project/app/build.gradle
          test -f bajil_android_project/settings.gradle

      - name: Set application display to landscape
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'bajil_android_project/app/src/main/AndroidManifest.xml'
          tree = ET.parse(p)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          changed = False
          for activity in root.findall('.//activity'):
              if activity.find('.//intent-filter') is not None:
                  activity.set(ns + 'screenOrientation', 'landscape')
                  changed = True
          if not changed:
              raise SystemExit('Launcher activity not found in AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('Launcher activity forced to landscape orientation')
          PY

      - name: Build installable APK
        working-directory: bajil_android_project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh bajil_android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bajil-Association-APK
          path: bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Preserve v8 source archive for controlled code review
        uses: actions/upload-artifact@v4
        with:
          name: V8-Source-Archive
          path: source-project.zip
          if-no-files-found: error
          retention-days: 7

