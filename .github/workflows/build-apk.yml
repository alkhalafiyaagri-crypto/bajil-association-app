name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type d
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install required Android packages
        shell: bash
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project archive
        run: |
          test -f source-project.zip
          unzip -l source-project.zip | head -40

      - name: Extract Android project
        run: unzip -q source-project.zip

      - name: Set association logo as Android launcher icon
        shell: bash
        run: |
          set -e
          APP="bajil_android_project/app/src/main"
          LOGO="$APP/assets/logo.png"
          test -s "$LOGO" || { echo "Association logo not found at $LOGO"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET
          app=Path("bajil_android_project/app/src/main")
          logo=app/"assets/logo.png"
          manifest=app/"AndroidManifest.xml"
          if not logo.is_file() or logo.stat().st_size < 100:
              raise SystemExit("Valid association logo image is missing")
          for density in ("mdpi","hdpi","xhdpi","xxhdpi","xxxhdpi"):
              folder=app/"res"/("mipmap-"+density)
              folder.mkdir(parents=True,exist_ok=True)
              shutil.copy2(logo,folder/"ic_launcher.png")
          ET.register_namespace("android","http://schemas.android.com/apk/res/android")
          tree=ET.parse(manifest)
          root=tree.getroot()
          ns="{http://schemas.android.com/apk/res/android}"
          application=root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          application.set(ns+"icon","@mipmap/ic_launcher")
          application.set(ns+"roundIcon","@mipmap/ic_launcher")
          tree.write(manifest,encoding="utf-8",xml_declaration=True)
          print("Association logo configured as Android launcher and round icon")
          PY

      - name: Capture original interface for precise repair
        uses: actions/upload-artifact@v4
        with:
          name: Bajil-UI-Source-Diagnostic
          path: bajil_android_project/app/src/main/assets/index.html
          if-no-files-found: error
          retention-days: 3

