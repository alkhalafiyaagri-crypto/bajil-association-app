name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls -la "$ANDROID_HOME"
          sdkmanager --version

      - name: Install Android platform and build tools
        run: yes | sdkmanager --licenses
        shell: bash

      - name: Install required Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project archive
        run: |
          test -f source-project.zip
          unzip -l source-project.zip | head -40

      - name: Extract Android project
        run: unzip -q source-project.zip

      - name: Locate Android project
        run: |
          test -f bajil_android_project/app/build.gradle
          test -f bajil_android_project/settings.gradle

      - name: Build installable APK
        working-directory: bajil_android_project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh bajil_android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bajil-Association-APK
          path: bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
