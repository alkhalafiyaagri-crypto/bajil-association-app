          .loginbox h2{font-size:clamp(15px,2.2vw,19px)!important;line-height:1.45!important;margin:6px 0!important}
          .loginbox input{min-height:48px!important;font-size:16px!important}
          .loginbox button{min-height:50px!important;border-radius:10px!important;font-size:16px!important}
          header{position:sticky!important;top:0!important;z-index:50!important;margin:0!important;padding:7px 12px!important;min-height:0!important;box-shadow:0 3px 12px rgba(0,0,0,.12)!important}
          header>div:first-child{display:flex!important;align-items:center!important;flex-wrap:nowrap!important;gap:9px!important;min-width:0!important}
          header img[alt="شعار الجمعية"]{width:46px!important;height:42px!important;flex:0 0 46px!important;object-fit:contain!important;border-radius:8px!important}
          header>div:first-child>div{flex:1 1 auto!important;min-width:0!important}
          header h1{font-size:clamp(12px,1.8vw,17px)!important;line-height:1.35!important;margin:0!important}
          header p{font-size:10px!important;line-height:1.3!important;margin:2px 0 0!important}
          header #installAppBtn{flex:0 0 auto!important;padding:6px 8px!important;font-size:10px!important}
          .wrap{margin:10px auto!important;padding:0 12px!important}
          .top{margin-top:8px!important}
          @media(max-width:560px){
            body{background-position:center 82%!important;background-size:92vw auto!important}
            header{padding:6px 8px!important}
            header img[alt="شعار الجمعية"]{width:38px!important;height:36px!important;flex-basis:38px!important}
            header h1{font-size:11px!important}
            header p{font-size:9px!important}
            .wrap{padding:0 8px!important;margin:8px auto!important}
          }
          </style>"""
          if 'id="bajil-final-layout"' in s:
              s=re.sub(r'<style id="bajil-final-layout">.*?</style>',css,s,flags=re.S)
          else:
              s=s.replace("</head>",css+"\\n</head>",1)
          p.write_text(s,encoding="utf-8")
          print("Login header hidden, login layer raised, compact sticky header and lower watermark applied.")
          # Hide the Android status bar at the native window level, preserving navigation controls.
          roots=Path("bajil_android_project/app/src/main").rglob("*")
          native=[x for x in roots if x.is_file() and x.suffix in (".kt",".java") and "MainActivity" in x.name]
          if not native:
              print("WARNING: MainActivity source not found; native status bar was not changed.")
          for src in native:
              code=src.read_text(encoding="utf-8")
              if "SYSTEM_UI_FLAG_FULLSCREEN" in code or "WindowInsetsController" in code:
                  print(f"Fullscreen status-bar handling already exists in {src}")
                  continue
              if src.suffix==".kt":
                  snippet="""\\n        @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
                  """
                  code=re.sub(r'(super\\.onCreate\\(savedInstanceState\\))',r'\\1'+snippet,code,count=1)
              else:
                  snippet="""\\n        getWindow().getDecorView().setSystemUiVisibility(
                  android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                  | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  """
                  code=re.sub(r'(super\\.onCreate\\(savedInstanceState\\)\\s*;)',r'\\1'+snippet,code,count=1)
              src.write_text(code,encoding="utf-8")
              print(f"Applied immersive status bar handling in {src}")
          PY
          grep -q 'id="bajil-final-layout"' bajil_android_project/app/src/main/assets/index.html

      - name: Capture original interface for precise repair
        uses: actions/upload-artifact@v4
        with:
          name: Bajil-UI-Source-Diagnostic
          path: bajil_android_project/app/src/main/assets/index.html
          if-no-files-found: error
          retention-days: 3

