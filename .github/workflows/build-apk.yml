      - name: Locate Android project
        run: |
          test -f bajil_android_project/app/build.gradle
          test -f bajil_android_project/settings.gradle

      - name: Set application display to landscape
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('bajil_android_project/app/src/main/AndroidManifest.xml')
          tree = ET.parse(p)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          if app is None:
              raise SystemExit('AndroidManifest.xml has no application element')
          activities = app.findall('activity')
          for activity in activities:
              activity.set(ns + 'screenOrientation', 'landscape')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print(f'Landscape orientation applied to {len(activities)} activity entries')
          PY

      - name: Build installable APK
        working-directory: bajil_android_project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh bajil_android_project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bajil-Association-APK
          path: bajil_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
