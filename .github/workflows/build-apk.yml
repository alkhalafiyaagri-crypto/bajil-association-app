          import re
          p=Path("bajil_android_project/app/src/main/assets/index.html")
          s=p.read_text(encoding="utf-8")
          css = """<style id="bajil-final-layout">
          html,body{margin:0!important;padding:0!important;width:100%;min-height:100%;overflow-x:hidden}
          body{background-position:center 78%!important;background-size:min(68vw,680px) auto!important;background-attachment:scroll!important}
          #login{position:fixed!important;inset:0!important;z-index:1000!important;display:flex;align-items:center;justify-content:center;padding:14px!important;background:linear-gradient(145deg,#082b19,#17633a)!important;overflow-y:auto!important}
          #login:not([style*="display: none"])~header{display:none!important}
          #login:not([style*="display: none"])~main{display:none!important}
