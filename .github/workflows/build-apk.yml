            private class PhoneFiles {
              @JavascriptInterface public void saveBase64(String name,String mime,String data){
                try{byte[] bytes=Base64.decode(data,Base64.DEFAULT);String safe=name.replaceAll("[^\\p{L}\\p{N}._ -]","_");
                  ContentValues values=new ContentValues();values.put(MediaStore.Downloads.DISPLAY_NAME,safe);values.put(MediaStore.Downloads.MIME_TYPE,mime);values.put(MediaStore.Downloads.RELATIVE_PATH,android.os.Environment.DIRECTORY_DOWNLOADS+"/Bajil Association");values.put(MediaStore.Downloads.IS_PENDING,1);
                  Uri uri=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,values);if(uri==null)throw new IOException("تعذر إنشاء الملف");
                  try(OutputStream out=getContentResolver().openOutputStream(uri)){out.write(bytes);}
                  values.clear();values.put(MediaStore.Downloads.IS_PENDING,0);getContentResolver().update(uri,values,null,null);
                  webView.post(()->webView.evaluateJavascript("alert('تم حفظ الملف في مجلد التنزيلات داخل مجلد Bajil Association')",null));
                }catch(Exception e){String msg=e.getMessage()==null?"تعذر حفظ الملف":e.getMessage();webView.post(()->webView.evaluateJavascript("alert("+org.json.JSONObject.quote(msg)+")",null));}
              }
            }
            @Override protected void onActivityResult(int req,int res,Intent data){super.onActivityResult(req,res,data);
              if(req==PICK_FILE){if(fileCallback!=null){Uri[] result=null;if(res==RESULT_OK&&data!=null&&data.getData()!=null)result=new Uri[]{data.getData()};fileCallback.onReceiveValue(result);fileCallback=null;}
                if(res==RESULT_OK&&data!=null&&data.getData()!=null)sendFileToPage(data.getData());}
            }
